name: Setup help
description: Installing or connecting the backend, a model or the extension
labels: ["setup"]
body:
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: ["Linux", "macOS", "Windows", "Other"]
    validations:
      required: true
  - type: textarea
    id: did
    attributes:
      label: What did you run, and what did you see?
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: avd doctor output
      render: text
