name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg16
        env:
          POSTGRES_USER: avd
          POSTGRES_PASSWORD: avd
          POSTGRES_DB: avd_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U avd -d avd_test" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      AVD_TEST_DATABASE_URL: postgresql+psycopg://avd:avd@localhost:5432/avd_test
      AVD_TEST_REDIS_URL: redis://localhost:6379/0
      AVD_LOG_LEVEL: WARNING
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: ffmpeg (authorized media path tests)
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg
      - run: pip install -e ".[dev,anthropic,semantic]"
      - name: Dependency audit (PyPI/OSV advisories)
        run: |
          pip freeze --exclude-editable > "$RUNNER_TEMP/requirements.txt"
          pipx run pip-audit -r "$RUNNER_TEMP/requirements.txt" --no-deps --progress-spinner off
      - name: Cache the pinned MiniLM ONNX model
        uses: actions/cache@v4
        with:
          path: backend/.model_cache
          key: minilm-onnx-913d7300ceae3b2d
      - name: Fetch and verify the embedding model (sha256-pinned)
        run: avd embeddings fetch-model
      - name: Lint and format
        run: |
          ruff check avd tests
          ruff format --check avd tests
      - name: Type check
        run: mypy avd
      - name: Migrations apply cleanly and match the models
        env:
          AVD_DATABASE_URL: postgresql+psycopg://avd:avd@localhost:5432/avd_test
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
      - name: Tests (SQLite + PostgreSQL/pgvector + Redis)
        run: pytest -q --cov=avd --cov-report=term
      - name: Local mode smoke test (avd start, SQLite, embedded worker, request guard)
        env:
          AVD_TEST_DATABASE_URL: ""
          AVD_TEST_REDIS_URL: ""
        run: |
          avd start --data-dir "$RUNNER_TEMP/avd-local" --demo --port 8799 > "$RUNNER_TEMP/start.log" 2>&1 &
          PID=$!
          for i in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:8799/health && break; sleep 1; done
          curl -sf http://127.0.0.1:8799/v1/status | python -c "import sys,json; s=json.load(sys.stdin); assert s['deployment_mode']=='local' and s['worker']['running'], s"
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: evil.example' http://127.0.0.1:8799/v1/meta)" = 400
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Origin: https://evil.example' http://127.0.0.1:8799/v1/users)" = 403
          kill -INT "$PID"; wait "$PID" || true
      - name: Benchmark (deterministic heuristic baseline on synthetic fixtures)
        run: avd bench --tag ci --out ../benchmarks/reports
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-report
          path: benchmarks/reports/ci.*

  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - name: Dependency audit
        run: |
          npm audit --omit=dev
          npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: extension-dist
          path: extension/dist

  pilot-dataset:
    # Re-fetches the licensed pilot at its pinned upstream commits and verifies every raw checksum
    # and parsed-content hash against the committed manifest (fails closed on any drift).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e .
      - uses: actions/cache@v4
        with:
          path: backend/.dataset_cache
          key: pilot-${{ hashFiles('benchmarks/datasets/real_pilot_v1/manifest.json') }}
      - name: Fetch, verify and import (SQLite)
        env:
          AVD_DATABASE_URL: sqlite:///${{ runner.temp }}/pilot.db
        run: |
          avd migrate
          avd dataset import

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config -q
      - run: docker build -f backend/Dockerfile -t avd-backend .
      - name: Image runs the CLI
        run: docker run --rm avd-backend avd --help
      - name: Image can process authorized media under resource limits
        run: docker run --rm avd-backend python -c "from avd.content import media; assert media.available() and media.limits_enforced()"
