[project]
name = "ai-video-discovery"
version = "0.1.0"
description = "Popularity-blind, multidimensional quality assessment and recommendation for YouTube videos."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "psycopg[binary]>=3.1",
  "pgvector>=0.3",
  "celery[redis]>=5.4",
  "redis>=5.0",
  "httpx>=0.27",
  "numpy>=1.26",
]

[project.optional-dependencies]
anthropic = ["anthropic>=1.0"]
ml = ["sentence-transformers>=3.0"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "mypy>=1.10",
  "ruff>=0.5",
]

[project.scripts]
avd = "avd.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["avd"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["B008", "RUF012", "E501", "RUF001"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = ["avd/migrations/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "postgres: requires a PostgreSQL+pgvector database (AVD_TEST_DATABASE_URL)",
  "redis: requires a Redis server (AVD_TEST_REDIS_URL)",
]
filterwarnings = ["ignore::DeprecationWarning:celery.*"]
